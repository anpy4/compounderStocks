[project]
name = "compounderstocks"
version = "0.1.0"
description = "Comgest Compounder Stock picking"
authors = [
    {name = "anpy4",email = "cgndre@yahoo.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "yfinance (>=0.2.66,<0.3.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "curl-cffi (>=0.7.4,<1.0.0)",
    "pytickersymbols (>=1.17.10,<2.0.0)",
    # yfinance 0.2.x calls Timestamp.utcnow(), deprecated since pandas 3.0.
    "pandas (>=2.2.0,<3.0.0)",
    "numpy (>=1.26.0,<3.0.0)",
    "matplotlib (>=3.9.0,<4.0.0)"
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "certifi (>=2025.10.5,<2027.0.0)",
    "pandas-stubs>=3.0.5.260914",
]
test = [
    "pytest (>=9.0.3,<10.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
