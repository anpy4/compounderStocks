[project]
name = "compounderstocks"
version = "0.1.0"
description = "Comgest Compounder Stock picking"
authors = [
    {name = "anpy4",email = "cgndre@yahoo.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yfinance (>=0.2.66,<0.3.0)",
    "seaborn (>=0.13.2,<0.14.0)"
]
package-mode = "false"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)",
    "certifi (>=2025.10.5,<2026.0.0)"

]
test = [
    "pytest (>=8.4.2,<9.0.0)"
]
